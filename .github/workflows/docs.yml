name: Deploy pdoc to GitHub Pages

on:
  push:
    branches: ["main", "riordinato"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa pdoc e le dipendenze del progetto
        run: |
          python -m pip install --upgrade pip
          pip install pdoc
          pip install -r requirements.txt
          pip install -e .

      - name: Genera documentazione pdoc
        run: |
          rm -rf docs
          mkdir -p docs
          PYTHONPATH="${PWD}/src" pdoc lib analisi -o docs -d google

      - name: Pubblica protocolli markdown
        run: |
          mkdir -p docs/protocol_docs
          cp src/lib/protocol_docs/*.md docs/protocol_docs/
          python - <<'PY'
          from pathlib import Path

          out = Path("docs/protocol_docs/index.html")
          files = sorted(Path("docs/protocol_docs").glob("*.md"))
          links = "\n".join(
              f'<li><a href="{f.name}">{f.name}</a></li>' for f in files
          )
          out.write_text(
              f"""<!doctype html>
          <html lang="it">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <title>Protocol docs</title>
          </head>
          <body>
            <h1>Protocol docs</h1>
            <p>File markdown sorgente dei protocolli strumentali.</p>
            <ul>
          {links}
            </ul>
          </body>
          </html>
          """,
              encoding="utf-8",
          )
          PY

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto per le Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
